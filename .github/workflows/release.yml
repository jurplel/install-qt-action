name: Release

# Trigger this workflow on GitHub Web UI. If GitHub is down, we don't need to do anything.

# In bash shell scripts of this workflow, I prefer hand-made shell scripts to concrete
# actions, especially 3rd-party ones, to reveal the actual logic.

on:
  workflow_dispatch:
    # The "Use workflow from" branch selected in the "Run workflow" dialog, based on
    # previous experiments, ONLY determines:
    # - the revision of the workflow file itself being used;
    # - the value of "github.ref" ($GITHUB_REF).
    # To ensure that all releases are based on the default branch, we have
    # "env.SOURCE_BRANCH" below and always checkout all branches by "actions/checkout".
    # Therefore, we do not use the value of "github.ref" in the release process.
    inputs:
      version:
        description: |
          The version number of the new release. In the form of "vX.Y.Z".
          Existing "vX" branches will be updated; missing "vX" branches will be created.
        required: true
        type: string
      use_pat:
        # "PAT" stands for "Personal Access Tokens". To bypass branches/tags protection,
        # only perm "Contents: write" is enough.
        # Don't forget to add "Write (Roles)" into the "Bypass list" of corresponding rulesets.
        # Adding "Write (Roles)" will essentially disable the safety net in response to human's
        # error, so it's recommended to remove the bypass item after a successful release ASAP.
        # It's also recommended to invalidate the PAT after creating a successful release.
        #
        # "secrets.GITHUB_TOKEN" can be used here if no protection rule applied. Read:
        # - [Feature Request] Allow github actions to bypass branch protection rules in certain specific circumstances
        #   https://github.com/orgs/community/discussions/13836
        description: |
          Use configured secret "IQTA_RELEASE_PAT" instead of built-in "GITHUB_TOKEN" to update
          branches and tags.
          The repository may have branch protection rules (branch ruleset), so a PAT that can
          bypass corresponding protection is required.
          Check comments in the workflow file for details.
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  SOURCE_BRANCH: master

jobs:
  release:
    name: Release ${{ inputs.version }}
    permissions:
      contents: write
    runs-on: ubuntu-26.04

    steps:
      - name: Extract version information
        id: info
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eux

          if ! [[ "$VERSION" =~ ^v(([0-9]+)\.[0-9]+\.[0-9]+)$ ]]; then
            exit 1
          fi
          full_version="${BASH_REMATCH[1]}"
          major_version="${BASH_REMATCH[2]}"

          echo "tag=v$full_version" >> "$GITHUB_OUTPUT"
          echo "target_branch=v$major_version" >> "$GITHUB_OUTPUT"

      # Ref:
      # - No documentation for git email and username causes actions to use 41898282+github-actions[bot]@users.noreply.github.com
      #   https://github.com/orgs/community/discussions/119597
      - name: Configure Git identity
        shell: bash
        run: |
          set -eux

          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # all branches and tags.
          persist-credentials: false  # otherwise malicious or unexpected git-pushes may happen
                                      # due to the job-level "permissions.contents: write".

      - name: Refuse to overwrite existing tag
        shell: bash
        env:
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          set -eux

          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi

      - name: Check if the target branch '${{ steps.info.outputs.target_branch }}' exists
        id: check_target_branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.info.outputs.target_branch }}
        run: |
          set -eux

          if git show-branch "origin/$TARGET_BRANCH"; then
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse release if '${{ env.SOURCE_BRANCH }}' is already merged into '${{ steps.info.outputs.target_branch }}'
        if: ${{ steps.check_target_branch.outputs.existing == 'true' }}
        shell: bash
        env:
          SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          TARGET_BRANCH: ${{ steps.info.outputs.target_branch }}
        run: |
          set -eux

          if git merge-base \
              --is-ancestor \
              "origin/$SOURCE_BRANCH" \
              "origin/$TARGET_BRANCH"; then
            echo "No new commits from $SOURCE_BRANCH to release into $TARGET_BRANCH."
            exit 1
          fi

      # Merge all commits from the source branch since the previous merge point.
      # The source branch itself remains untouched.
      - name: Start merging branch '${{ env.SOURCE_BRANCH }}' if branch '${{ steps.info.outputs.target_branch }}' exists
        if: ${{ steps.check_target_branch.outputs.existing == 'true' }}
        shell: bash
        env:
          SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          TARGET_BRANCH: ${{ steps.info.outputs.target_branch }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          set -eux

          git switch -c "$TARGET_BRANCH" --track "origin/$TARGET_BRANCH"

          # Preserve continuous history by starting a merge commit.
          # The "ours" strategy guarantees that this merge has no content conflicts.
          git merge \
            --no-commit \
            --no-ff \
            --strategy 'ours' \
            -m "Build $TAG after merging branch '$SOURCE_BRANCH' into $TARGET_BRANCH" \
            "origin/$SOURCE_BRANCH"

          # Empty the working tree.
          git rm -r .
          git clean -xfd

          # Sync with the "SOURCE_BRANCH" branch.
          git checkout "origin/$SOURCE_BRANCH" -- .
          git add .

      - name: Create branch '${{ steps.info.outputs.target_branch }}' for new major versions
        if: ${{ steps.check_target_branch.outputs.existing == 'false' }}
        shell: bash
        env:
          SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          TARGET_BRANCH: ${{ steps.info.outputs.target_branch }}
        run: |
          set -eux

          git switch --no-track -c "$TARGET_BRANCH" "origin/$SOURCE_BRANCH"

      # Do NOT cache anything.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24

      - name: Recreate Node.js files and finalize the merge commit
        shell: bash
        env:
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          set -eux

          cd action

          npm ci
          npm run build
          npm prune --omit=dev

          git add ./lib/main.js
          git add --force ./node_modules

          untracked_files="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked_files" ]]; then
            echo "Unexpected untracked files detected: $untracked_files"
            exit 1
          fi

          if ! git diff --exit-code; then
            echo 'Unexpected tracked file changes detected.'
            exit 1
          fi

          # Finalize the pending merge.
          git commit --no-edit --date=now

          git tag "$TAG"

      # Search "x-access-token" in:
      # - Authenticating as a GitHub App installation - GitHub Docs
      #   https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/authenticating-as-a-github-app-installation
      - name: Update branch and push the tag
        shell: bash
        env:
          TAG: ${{ steps.info.outputs.tag }}
          TARGET_BRANCH: ${{ steps.info.outputs.target_branch }}

          USE_PAT: ${{ inputs.use_pat }}
          PAT: ${{ secrets.IQTA_RELEASE_PAT }}
          BUILTIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GH_REPO: ${{ github.repository }}
        run: |
          set -eu  # no "set -x", otherwise not safe for tokens.

          if [[ "$USE_PAT" == 'true' ]]; then
            token="$PAT"
          else
            token="$BUILTIN_TOKEN"
          fi

          git push --atomic "https://x-access-token:${token}@github.com/${GH_REPO}.git" \
            "HEAD:$TARGET_BRANCH" \
            "refs/tags/$TAG"

      # If this step fails, we can manually release a new version on GitHub Web UI.
      - name: Create tag and release with generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.info.outputs.tag }}
          TARGET_BRANCH: ${{ steps.info.outputs.target_branch }}
        run: |
          set -eux

          # Use "--verify-tag" to make sure GitHub can see the tag.
          gh release create "$TAG" \
            --title "install-qt-action $TAG" \
            --target "$TARGET_BRANCH" \
            --generate-notes \
            --latest \
            --verify-tag
